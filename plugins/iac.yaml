apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: iac
spec:
  version: v0.0.2
  homepage: https://github.com/Facets-cloud/iac-generator
  shortDescription: Manage iac.facets.cloud Releases (create, compress, decompress)
  description: |
    Client-side helper for the iac-generator operator. Validate,
    size-compress and apply a Release, and compress/decompress large
    Release specs so they fit under etcd's per-object limit.
  platforms:
  - selector: { matchLabels: { os: linux, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.2/kubectl-iac_v0.0.2_linux_amd64.tar.gz
    sha256: b427be3cb9afcdaf1f62452ab6918ef882f636176d085e52430d259ec6dd889b
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: linux, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.2/kubectl-iac_v0.0.2_linux_arm64.tar.gz
    sha256: 2c303815c061e61c836431b125af3846bc1f05699ea330fc0fddc2cdd4469ba3
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.2/kubectl-iac_v0.0.2_darwin_amd64.tar.gz
    sha256: 529d76211981701569958ec9371f771df98ca56513b52874282b4fd2287b78c4
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.2/kubectl-iac_v0.0.2_darwin_arm64.tar.gz
    sha256: 689701051d659933b8208df267a2bb994df617133986d0b0d27f41e9dc1e1e62
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
