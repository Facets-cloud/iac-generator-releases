apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: iac
spec:
  version: v1.1.0
  homepage: https://github.com/Facets-cloud/iac-generator
  shortDescription: Manage iac.facets.cloud Releases (create, compress, decompress)
  description: |
    Client-side helper for the iac-generator operator. Validate,
    size-compress and apply a Release, and compress/decompress large
    Release specs so they fit under etcd's per-object limit.
  platforms:
  - selector: { matchLabels: { os: linux, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.1.0/kubectl-iac_v1.1.0_linux_amd64.tar.gz
    sha256: 00efef18c610bff7592363dec88b622a2e5e7787899a7269765ab512daabccd9
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: linux, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.1.0/kubectl-iac_v1.1.0_linux_arm64.tar.gz
    sha256: 38948f90f7836eca32a84030d0941057a17df27fac3cd8b52dd0d320ca500f95
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.1.0/kubectl-iac_v1.1.0_darwin_amd64.tar.gz
    sha256: 40f6d6a2c8aa1614282dcfdff7ee687a8f220ba21e8cf25a159b58c1fe99d667
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.1.0/kubectl-iac_v1.1.0_darwin_arm64.tar.gz
    sha256: c9a6f21dc4c5268cc7783f7c18d55c33afaa68043638dcc9e3e1e9f0678ef8e7
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
