apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: iac
spec:
  version: v1.0.0
  homepage: https://github.com/Facets-cloud/iac-generator
  shortDescription: Manage iac.facets.cloud Releases (create, compress, decompress)
  description: |
    Client-side helper for the iac-generator operator. Validate,
    size-compress and apply a Release, and compress/decompress large
    Release specs so they fit under etcd's per-object limit.
  platforms:
  - selector: { matchLabels: { os: linux, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.0.0/kubectl-iac_v1.0.0_linux_amd64.tar.gz
    sha256: 624f4c0f123c333071a8e0a37a6496131b4d9f851487320289991239fbcc8c84
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: linux, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.0.0/kubectl-iac_v1.0.0_linux_arm64.tar.gz
    sha256: 76a00b22d25f2775f888529fcc337b76d92dc53b402ee6d3069c281421e55a52
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.0.0/kubectl-iac_v1.0.0_darwin_amd64.tar.gz
    sha256: 4087b8871b530206a3f5a99dd0ac33e71e1bb323de033334a21299bf257edcd0
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v1.0.0/kubectl-iac_v1.0.0_darwin_arm64.tar.gz
    sha256: 264383eb98b04001f265ebb538ef6aab423b1389729f02180820020ecfb980a0
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
