apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: iac
spec:
  version: v0.0.1
  homepage: https://github.com/Facets-cloud/iac-generator
  shortDescription: Manage iac.facets.cloud Releases (create, compress, decompress)
  description: |
    Client-side helper for the iac-generator operator. Validate,
    size-compress and apply a Release, and compress/decompress large
    Release specs so they fit under etcd's per-object limit.
  platforms:
  - selector: { matchLabels: { os: linux, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.1/kubectl-iac_v0.0.1_linux_amd64.tar.gz
    sha256: 03af0187f87d9b7b97f9c2b15894c74e71f78fa410c8ef6c2029eea119bbe295
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: linux, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.1/kubectl-iac_v0.0.1_linux_arm64.tar.gz
    sha256: 7d04e97bcbd0efe5822c51972edcdbb60ad214e815d9ef16601446807bb8c016
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: amd64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.1/kubectl-iac_v0.0.1_darwin_amd64.tar.gz
    sha256: 1e9c70279859550c9f3641947fec611756c477422bfd8c9ce3e5123f08bb4f70
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
  - selector: { matchLabels: { os: darwin, arch: arm64 } }
    uri: https://github.com/Facets-cloud/iac-generator-releases/releases/download/kubectl-iac-v0.0.1/kubectl-iac_v0.0.1_darwin_arm64.tar.gz
    sha256: aecd758aa1324875d7da8122b6202a43ca3ef5ab617d79529da0bcf104da2096
    bin: kubectl-iac
    files:
    - from: kubectl-iac
      to: .
